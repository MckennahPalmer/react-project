<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Scrimba App</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="root">If you see this text, JavaScript hasn't replaced the content.</div>
        <noscript>Please enable JavaScript to run this app.</noscript>
        <!-- visual debug: will run immediately when the page loads -->
        <script>
            try {
                console.log('inline-script ran');
                // bright visual border so it's obvious this HTML executed
                document.documentElement.style.border = '8px solid magenta';
                var root = document.getElementById('root');
                if (root) root.style.padding = '12px';
            } catch (e) {
                console.error('visual debug failed', e);
            }
        </script>
        <script src="dist/index.pack.js"></script>
    </body>
</html>
